<script>

    // =========================

    // =========================



    // =========================
    // VARIABLES
    // =========================

    let currentQuestion = 0;

    let selectedAnswers = new Array(questions.length).fill(null);
    
    let studentClass = "";
let studentSubject = "";
    
    function getStudentName() {
    const name = document.getElementById("studentName").value.trim();

    if (name === "") {
        alert("Please enter the student's name.");
        return false;
    }

    return true;
}

let activeQuestions = questions;

function startTest() {

    const name = document.getElementById("studentNameStart").value.trim();
    const selectedClass = document.getElementById("classSelect").value;
    const selectedSubject = document.getElementById("studentSubjectStart").value;

studentClass = selectedClass;
studentSubject = selectedSubject;

    if (name === "") {
        alert("Please enter the student's name.");
        return;
    }

    if (selectedClass === "") {
        alert("Please select a class.");
        return;
    }

    if (selectedSubject === "") {
        alert("Please select a subject.");
        return;
    }
    
    
        // Select question bank according to subject
    if (selectedSubject === "Science") {
        activeQuestions = questions;
    } 
    else if (selectedSubject === "Mathematics") {
        activeQuestions = mathsQuestions;
    } 
    else {
        alert("Question paper for this subject is not available yet.");
        return;
    }

    
    

    // Save student information
    document.getElementById("studentName").value = name;

    // Hide the start screen
    document.getElementById("startScreen").style.display = "none";

    // Show the quiz
    document.getElementById("quizBox").style.display = "block";

    // Start from Question 1
    currentQuestion = 0;

if (selectedSubject === "Science") {
    activeQuestions = questions;
} 
else if (selectedSubject === "Mathematics") {
    activeQuestions = mathsQuestions;
} 
else {
    alert("Question paper for this subject is not available yet.");
    return;
}

selectedAnswers = new Array(activeQuestions.length).fill(null);

loadQuestion();

}


    // =========================
    // LOAD QUESTION
    // =========================

    function loadQuestion() {

        const q = activeQuestions[currentQuestion];

        document.getElementById("progress").innerText =
            "Question " + (currentQuestion + 1) +
" of " + activeQuestions.length;

        document.getElementById("question").innerText =
            q.question;

        const optionsDiv =
            document.getElementById("options");

        optionsDiv.innerHTML = "";


        q.options.forEach((option, index) => {

            const label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `
                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                    ${selectedAnswers[currentQuestion] === index ? "checked" : ""}
                    onchange="selectAnswer(${index})"
                >
                ${option}
            `;

            optionsDiv.appendChild(label);

        });


        // Previous button

        if (currentQuestion === 0) {
            document.getElementById("prevBtn").style.visibility =
                "hidden";
        } else {
            document.getElementById("prevBtn").style.visibility =
                "visible";
        }


        // Next / Submit button

        if (currentQuestion === activeQuestions.length - 1) {
            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("submitBtn").style.display =
                "block";

        } else {

            document.getElementById("nextBtn").style.display =
                "block";

            document.getElementById("submitBtn").style.display =
                "none";
        }

    }


    // =========================
    // SELECT ANSWER
    // =========================

    function selectAnswer(answer) {

        selectedAnswers[currentQuestion] = answer;

    }


    // =========================
    // NEXT QUESTION
    // =========================

    function nextQuestion() {

        if (currentQuestion < activeQuestions.length - 1) {

            currentQuestion++;

            loadQuestion();

        }

    }


    // =========================
    // PREVIOUS QUESTION
    // =========================

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            loadQuestion();

        }

    }


    // =========================
    // SUBMIT QUIZ
    // =========================

    function submitQuiz() {
    
    if (!getStudentName()) {
    return;
}

    let score = 0;

    let reviewHTML = "";

    activeQuestions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        if (selected === question.answer) {
            score++;
        }

        let selectedText =
            selected === null
            ? "Not Answered"
            : question.options[selected];

        let correctText =
            question.options[question.answer];

        let status =
            selected === question.answer
            ? "✅ Correct"
            : "❌ Wrong";

        reviewHTML += `
            <div class="review-question">

                <h3>Q${index + 1}. ${question.question}</h3>

                <p>
                    <strong>Your Answer:</strong>
                    ${selectedText}
                </p>

                <p>
                    <strong>Correct Answer:</strong>
                    ${correctText}
                </p>

                <p class="status">
                    ${status}
                </p>

            </div>
        `;
    });


    const percentage = Math.round((score / activeQuestions.length) * 100);

    document.getElementById("quizBox").style.display =
        "none";
        
        const studentName = document.getElementById("studentName").value.trim();

document.getElementById("studentResult").innerText =
    "Student Name: " + studentName;

    document.getElementById("result").style.display =
        "block";


    document.getElementById("score").innerText =
        score + " / " + activeQuestions.length;


    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "%";
        
        


    document.getElementById("answerReview").innerHTML =
        reviewHTML;
}


    // =========================
    // RESTART QUIZ
    // =========================

function endTest() {

    if (!getStudentName()) {
        return;
    }

    let confirmEnd = confirm(
        "Are you sure you want to end the test?"
    );

    if (!confirmEnd) {
        return;
    }

    // Calculate result
    let score = 0;
    let attempted = 0;

    activeQuestions.forEach((question, index) => {

        if (selectedAnswers[index] !== null) {
            attempted++;
        }

        if (
            question.answer !== null &&
            selectedAnswers[index] === question.answer
        ) {
            score++;
        }
    });

    let percentage = Math.round(
        (score / activeQuestions.length) * 100
    );

    // Hide quiz
    document.getElementById("quizBox").style.display = "none";

    const studentName =
        document.getElementById("studentName").value.trim();

    document.getElementById("studentResult").innerText =
        "Student Name: " + studentName;

    // Show result
    document.getElementById("result").style.display = "block";

    // Show score
    document.getElementById("score").innerText =
        score + " / " + activeQuestions.length;

    // Show percentage and attempted questions
    document.getElementById("percentage").innerText =
        "Percentage: " + percentage + "% | Attempted: " +
        attempted + " / " + activeQuestions.length;

    // Show answer review
    showAnswerReview();
}

function showAnswerReview() {
    const reviewContainer =
        document.getElementById("answerReview");

    reviewContainer.innerHTML = "";

    activeQuestions.forEach((question, index) => {

        const div = document.createElement("div");
        div.className = "review-question";

        const selectedAnswer = selectedAnswers[index];

        let userAnswer = "Not Attempted";
        let answerStatus = "❌";

        if (selectedAnswer !== null) {
            userAnswer = question.options[selectedAnswer];

            if (selectedAnswer === question.answer) {
                answerStatus = "✅";
            }
        }

        const correctAnswer =
            question.options[question.answer];

        div.innerHTML = `
            <p>
                <strong>Question ${index + 1}:</strong>
                ${question.question}
            </p>

            <p>
                ${answerStatus} Your Answer: ${userAnswer}
            </p>

            <p>
                ✅ Correct Answer: ${correctAnswer}
            </p>
        `;

        reviewContainer.appendChild(div);
    });
}

function toggleAnswers() {

    const answerReview = document.getElementById("answerReview");
    const button = document.getElementById("showAnswersBtn");

    if (answerReview.style.display === "none" ||
        answerReview.style.display === "") {

        showAnswerReview();

        answerReview.style.display = "block";
        button.innerText = "Hide Answers";

    } else {

        answerReview.style.display = "none";
        button.innerText = "Show Answers";
    }
}

   function restartQuiz() {
    currentQuestion = 0;

    selectedAnswers = new Array(activeQuestions.length).fill(null);

    document.getElementById("result").style.display = "none";
    document.getElementById("quizBox").style.display = "block";
    document.getElementById("answerReview").style.display = "none";
    document.getElementById("showAnswersBtn").innerText = "Show Answers";

    loadQuestion();
}
function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const studentName = document.getElementById("studentName").value.trim();
    const totalQuestions = activeQuestions.length;

    let correct = 0;
    let attempted = 0;

    activeQuestions.forEach((q, index) => {
        if (selectedAnswers[index] !== null) {
            attempted++;

            if (selectedAnswers[index] === q.answer) {
                correct++;
            }
        }
    });

    const wrong = attempted - correct;
    const unattempted = totalQuestions - attempted;
    const percentage = Math.round((correct / totalQuestions) * 100);

    let grade;
    let gradeText;

    if (percentage >= 90) {
        grade = "A";
        gradeText = "Superior";
    } else if (percentage >= 75) {
        grade = "B";
        gradeText = "Above Average";
    } else if (percentage >= 50) {
        grade = "C";
        gradeText = "Average";
    } else {
        grade = "D";
        gradeText = "Below Average";
    }

    const date = new Date().toLocaleDateString();

    const doc = new jsPDF();

    // ------------------------------------------------
    // PAGE BORDER
    // ------------------------------------------------

    doc.setFillColor(245, 250, 255);
    doc.rect(0, 0, 210, 297, "F");

    doc.setDrawColor(20, 105, 190);
    doc.setLineWidth(2);
    doc.rect(5, 5, 200, 287);

    // ------------------------------------------------
    // HEADER
    // ------------------------------------------------

    doc.setFillColor(20, 105, 190);
    doc.roundedRect(10, 10, 190, 42, 5, 5, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(24);
    doc.text("QUIZ REPORT", 105, 28, { align: "center" });

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Learn  •  Practice  •  Improve", 105, 39, {
        align: "center"
    });

    // ------------------------------------------------
    // STUDENT INFORMATION
    // ------------------------------------------------

    doc.setFillColor(225, 242, 255);
    doc.setDrawColor(80, 170, 230);
    doc.roundedRect(10, 58, 190, 42, 4, 4, "FD");

    doc.setTextColor(20, 50, 90);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);

    doc.text("Student Name:", 18, 70);
    doc.text("Class:", 18, 82);
    doc.text("Subject:", 18, 94);

    doc.setFont("helvetica", "normal");

    doc.text(studentName || "Student", 55, 70);
    doc.text(studentClass || "-", 55, 82);
    doc.text(studentSubject || "-", 55, 94);

    doc.setFont("helvetica", "bold");
    doc.text("Date:", 135, 70);

    doc.setFont("helvetica", "normal");
    doc.text(date, 158, 70);

    // ------------------------------------------------
    // RESULT TABLE
    // ------------------------------------------------

    doc.setFillColor(20, 105, 190);
    doc.roundedRect(10, 108, 120, 88, 4, 4, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text("RESULT", 70, 120, { align: "center" });

    const rows = [
        ["Total Questions", totalQuestions],
        ["Attempted", attempted],
        ["Correct Answer", correct],
        ["Wrong Answer", wrong],
        ["Unattempted", unattempted],
        ["Score", correct + " / " + totalQuestions],
        ["Percentage", percentage + "%"],
        ["Grade", grade]
    ];

    let y = 131;

    rows.forEach((row, index) => {

        if (index % 2 === 0) {
            doc.setFillColor(232, 244, 255);
        } else {
            doc.setFillColor(248, 252, 255);
        }

        doc.rect(11, y - 6, 118, 8, "F");

        doc.setTextColor(20, 40, 60);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);

        doc.text(row[0], 17, y);

        doc.setFont("helvetica", "bold");
        doc.text(String(row[1]), 105, y);

        y += 10;
    });

    // ------------------------------------------------
    // GRADE BOX
    // ------------------------------------------------

    doc.setFillColor(255, 249, 225);
    doc.setDrawColor(245, 190, 40);
    doc.roundedRect(137, 108, 63, 88, 4, 4, "FD");

    doc.setTextColor(20, 50, 90);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text("GRADE", 168.5, 120, { align: "center" });

    // Grade circle
    doc.setFillColor(245, 180, 20);
    doc.circle(168.5, 140, 15, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(22);
    doc.text(grade, 168.5, 147, { align: "center" });

    doc.setTextColor(20, 50, 90);
    doc.setFontSize(9);
    doc.text(gradeText, 168.5, 163, { align: "center" });

    // Percentage
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.text(percentage + "%", 168.5, 181, {
        align: "center"
    });

    doc.setFontSize(8);
    doc.setFont("helvetica", "normal");
    doc.text("Your Score", 168.5, 189, {
        align: "center"
    });

    // ------------------------------------------------
    // GRADING SYSTEM
    // ------------------------------------------------

    doc.setFillColor(242, 237, 255);
    doc.setDrawColor(150, 120, 220);
    doc.roundedRect(10, 202, 190, 30, 4, 4, "FD");

    doc.setTextColor(80, 55, 150);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("GRADING SYSTEM", 18, 212);

    doc.setFontSize(8);
    doc.setTextColor(20, 50, 90);

    doc.text("A", 20, 222);
    doc.text("90–100%  Superior", 27, 222);

    doc.text("B", 75, 222);
    doc.text("75–89%  Above Average", 82, 222);

    doc.text("C", 135, 222);
    doc.text("50–74%  Average", 142, 222);

    doc.text("D", 20, 228);
    doc.text("Below 50%  Below Average", 27, 228);

    // ------------------------------------------------
    // REMARKS
    // ------------------------------------------------

    doc.setFillColor(232, 250, 242);
    doc.setDrawColor(70, 180, 130);
    doc.roundedRect(10, 238, 190, 25, 4, 4, "FD");

    doc.setTextColor(25, 110, 75);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.text("REMARKS", 18, 248);

    doc.setTextColor(30, 60, 70);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);

    let remark;

    if (percentage >= 90) {
        remark = "Excellent performance! Keep up the great work.";
    } else if (percentage >= 75) {
        remark = "Good performance! Keep working towards a higher grade.";
    } else if (percentage >= 50) {
        remark = "Good effort. More practice can improve your result.";
    } else {
        remark = "Keep practicing and focus on improving your fundamentals.";
    }

    doc.text(remark, 18, 256);

    // ------------------------------------------------

    doc.setDrawColor(40, 70, 110);

    doc.line(25, 278, 75, 278);
    doc.line(135, 278, 185, 278);

    doc.text("Teacher", 50, 284, { align: "center" });

}

function downloadAnswerSheet() {

    const { jsPDF } = window.jspdf;

    const studentName =
        document.getElementById("studentName").value.trim();

    const doc = new jsPDF("p", "mm", "a4");

    // =========================
    // COLORS
    // =========================
    const gold = [190, 165, 125];
    const lightGold = [210, 190, 155];
    const darkText = [55, 55, 55];

    const pageWidth = 210;

    const left = 12;
    const col1 = 27;
    const col2 = 82;
    const col3 = 125;
    const col4 = 198;

    // =========================
    // FIX SPECIAL CHARACTERS
    // =========================
    function cleanText(text) {

        if (text === null || text === undefined) {
            return "";
        }

        return String(text)
            .replace(/−/g, "-")   // Unicode minus → normal minus
            .replace(/–/g, "-")   // en dash
            .replace(/—/g, "-");  // em dash
    }

    // =========================
    // DRAW CHECK / CROSS
    // =========================
    function drawStatusIcon(x, y, type) {

        doc.setLineWidth(0.8);

        if (type === "correct") {

            // ✓
            doc.setDrawColor(25, 150, 80);

            doc.line(x, y + 1, x + 1.5, y + 3);
            doc.line(x + 1.5, y + 3, x + 5, y - 2);

        } else if (type === "wrong") {

            // ✕
            doc.setDrawColor(200, 45, 45);

            doc.line(x, y - 2, x + 4, y + 3);
            doc.line(x + 4, y - 2, x, y + 3);

        } else {

            // ○ Not attempted
            doc.setDrawColor(130, 130, 130);

            doc.circle(x + 2, y, 2, "S");
        }
    }

    // =========================
    // HEADER
    // =========================
    function drawHeader() {

        doc.setFont("helvetica", "bold");
        doc.setFontSize(30);
        doc.setTextColor(...gold);

        doc.text(
            "ANSWERSHEET",
            left,
            30
        );

        // Student information
        const infoX = 125;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        doc.setTextColor(...gold);

        doc.text("NAME:", infoX, 16);
        doc.line(infoX + 18, 16, 198, 16);

        doc.text("CLASS:", infoX, 27);
        doc.line(infoX + 18, 27, 198, 27);

        doc.text("SUBJECT:", infoX, 38);
        doc.line(infoX + 22, 38, 198, 38);

        // Values
        doc.setFontSize(9);
        doc.setTextColor(...darkText);

        doc.text(
            cleanText(studentName),
            infoX + 20,
            14
        );

        doc.text(
            cleanText(studentClass),
            infoX + 20,
            25
        );

        doc.text(
            cleanText(studentSubject),
            infoX + 24,
            36
        );
    }

    // =========================
    // TABLE HEADER
    // =========================
    function drawTableHeader(y) {

        const height = 14;

        doc.setFillColor(...gold);
        doc.setDrawColor(120, 100, 75);
        doc.setLineWidth(0.3);

        doc.rect(
            left,
            y,
            col1 - left,
            height,
            "FD"
        );

        doc.rect(
            col1,
            y,
            col2 - col1,
            height,
            "FD"
        );

        doc.rect(
            col2,
            y,
            col3 - col2,
            height,
            "FD"
        );

        doc.rect(
            col3,
            y,
            col4 - col3,
            height,
            "FD"
        );

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(255, 255, 255);

        doc.text(
            "S NO.",
            (left + col1) / 2,
            y + 9,
            { align: "center" }
        );

        doc.text(
            "QUESTION",
            (col1 + col2) / 2,
            y + 9,
            { align: "center" }
        );

        doc.text(
            "YOUR ANSWER",
            (col2 + col3) / 2,
            y + 9,
            { align: "center" }
        );

        doc.text(
            "CORRECT ANSWER",
            (col3 + col4) / 2,
            y + 9,
            { align: "center" }
        );

        return y + height;
    }

    // =========================
    // TEXT WRAPPING
    // =========================
    function wrapText(text, width) {

        return doc.splitTextToSize(
            cleanText(text),
            width
        );
    }

    // =========================
    // PAGE HEADER
    // =========================
    function drawPageHeader() {

        drawHeader();

        return drawTableHeader(50);
    }

    let y = drawPageHeader();

    const questionWidth = col2 - col1 - 4;
    const answerWidth = col3 - col2 - 9;
    const correctWidth = col4 - col3 - 4;

    // =========================
    // QUESTIONS
    // =========================
    activeQuestions.forEach((question, index) => {

        const selected = selectedAnswers[index];

        const yourAnswer =
            selected === null
                ? "Not Answered"
                : question.options[selected];

        const correctAnswer =
            question.answer === null
                ? "Answer not available"
                : question.options[question.answer];

        // Determine status
        let status;

        if (selected === null) {

            status = "notAttempted";

        } else if (
            question.answer !== null &&
            selected === question.answer
        ) {

            status = "correct";

        } else {

            status = "wrong";
        }

        // Wrap text
        const questionLines =
            wrapText(
                `${index + 1}. ${question.question}`,
                questionWidth
            );

        const answerLines =
            wrapText(
                yourAnswer,
                answerWidth
            );

        const correctLines =
            wrapText(
                correctAnswer,
                correctWidth
            );

        const maxLines = Math.max(
            questionLines.length,
            answerLines.length,
            correctLines.length,
            1
        );

        const rowHeight =
            Math.max(10, maxLines * 4.5 + 3);

        // New page
        if (y + rowHeight > 280) {

            doc.addPage();

            y = drawPageHeader();
        }

        // =========================
        // CELLS
        // =========================

        doc.setFillColor(255, 255, 255);
        doc.setDrawColor(...lightGold);
        doc.setLineWidth(0.25);

        doc.rect(
            left,
            y,
            col1 - left,
            rowHeight,
            "FD"
        );

        doc.rect(
            col1,
            y,
            col2 - col1,
            rowHeight,
            "FD"
        );

        doc.rect(
            col2,
            y,
            col3 - col2,
            rowHeight,
            "FD"
        );

        doc.rect(
            col3,
            y,
            col4 - col3,
            rowHeight,
            "FD"
        );

        // =========================
        // QUESTION NUMBER
        // =========================

        doc.setTextColor(...gold);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);

        doc.text(
            String(index + 1),
            (left + col1) / 2,
            y + rowHeight / 2 + 2,
            { align: "center" }
        );

        // =========================
        // QUESTION
        // =========================

        doc.setTextColor(...darkText);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);

        doc.text(
            questionLines,
            col1 + 2,
            y + 5
        );

        // =========================
        // YOUR ANSWER + ICON
        // =========================

        const iconY =
            y + rowHeight / 2;

        drawStatusIcon(
            col2 + 2,
            iconY,
            status
        );

        doc.setTextColor(...darkText);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);

        doc.text(
            answerLines,
            col2 + 9,
            y + 5
        );

        // =========================
        // CORRECT ANSWER
        // =========================

        // Always show ✓ before correct answer
        drawStatusIcon(
            col3 + 2,
            iconY,
            "correct"
        );

        doc.setTextColor(...darkText);

        doc.text(
            correctLines,
            col3 + 9,
            y + 5
        );

        y += rowHeight;
    });

    // =========================
    // SAVE PDF
    // =========================

    const safeName =
        studentName
            ? studentName
                .replace(/[^\w\s-]/g, "")
                .replace(/\s+/g, "_")
            : "Student";

    const safeSubject =
        studentSubject
            ? studentSubject
                .replace(/[^\w\s-]/g, "")
                .replace(/\s+/g, "_")
            : "Quiz";

    doc.save(
        safeName +
        "_" +
        safeSubject +
        "_AnswerSheet.pdf"
    );
}

// Prevent Back button from exiting during the test

history.pushState({ quizPage: true }, "", window.location.href);

window.addEventListener("popstate", function () {

    const quizBox = document.getElementById("quizBox");

    // Only protect the page while the test is running
    if (quizBox && quizBox.style.display !== "none") {

        // Immediately create another history entry
        history.pushState({ quizPage: true }, "", window.location.href);

        const confirmExit = confirm(
            "Are you sure you want to exit the test?"
        );

        if (confirmExit) {
            // Exit the test
            document.getElementById("quizBox").style.display = "none";
            document.getElementById("result").style.display = "block";

            // Optional: show result as exited
            document.getElementById("score").innerText =
                "Test Ended";

        }
    }
});
